<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Examination Platform</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body class="bg-[#F8F6F6] pt-[56px] select-none">
    <header class="bg-white py-2 fixed top-0 w-full z-50">
      <div class="myContianer flex justify-between items-center">
        <div class="logo flex items-center">
          <div class="image-contianer w-10 h-10 rounded-full overflow-hidden">
            <img src="./assets/logo.jfif" class="w-full" alt="student image" />
          </div>
          <a href="#">student portal</a>
        </div>
        <div class="student-info flex gap-1 items-center">
          <div class="student-name">student Name</div>
          <span class="text-gray-500 text-2xl">|</span>
          <button
            class=" logout flex items-center gap-2 px-4 py-2 rounded-lg bg-red-100 font-medium hover:bg-red-400 transition-all duration-200 shadow-sm"
          >
            <span>Logout</span>
            <img
              src="./assets/icons/icons8-logout-50.png"
              alt="logout"
              class="w-4 h-4"
            />
          </button>
        </div>
      </div>
    </header>
    <main
      class="myContianer min-h-[calc(100vh-64px)] md:min-h-[calc(100vh-72px)] w-full max-w-7xl mx-auto px-4 md:px-6 lg:px-8 flex items-center justify-center py-8 md:py-12"
    >
      <div class="w-full max-w-5xl">
        <div class="p-4 md:p-6">
          <div
            class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4"
          >
            <div>
              <h2
                class="text-xl md:text-2xl lg:text-3xl font-bold text-gray-900"
              >
                Exam Result
              </h2>
              <p class="text-xs md:text-sm text-gray-500 mt-1">
                Final Score Report For JS
              </p>
            </div>
            <button
              onclick="window.print()"
              class="print:hidden flex items-center justify-center gap-2 px-4 md:px-6 py-2 md:py-2.5 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:shadow-md transition-all duration-200 text-sm md:text-base font-medium whitespace-nowrap"
            >
              <svg
                class="w-4 h-4 md:w-5 md:h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"
                />
              </svg>
              <span class="hidden sm:inline">Print Result</span>
              <span class="sm:hidden">Print</span>
            </button>
          </div>
        </div>
        <div
          class="rounded-lg overflow-hidden inset-shadow-sm shadow-md mb-6 grid grid-cols-1 md:grid-cols-2"
        >
          <div
            class="grade flex flex-col justify-content-center items-center bg-white p-4 md:p-6 lg:p-8 bg-tr"
          >
            <div
              class="shock-message flex justify-center items-center gap-1 mb-2 px-2 rounded-full"
            ></div>
            <div
              class="relative w-[200px] h-[200px] rounded-full progress-circle flex-col flex items-center justify-center"
            >
              <span class="text-5xl font-bold"></span>
              <p class="text-white font-semibold">Total Score</p>
            </div>
            <div class="text-center max-w-[280px]">
              <p
                class="score-message text-sm text-gray-600 leading-relaxed"
              ></p>
            </div>
          </div>
          <div class="p-4 md:p-6 lg:p-8">
            <h2 class="text-lg capitalize font-bold mb-2">
              performance summary
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div
                class="shadow-md border-s-4 border-solid border-blue-300 rounded-lg p-5"
              >
                <div class="flex items-center gap-1 mb-2">
                  <img
                    src="./assets/icons/icons8-checklist-50.png"
                    class="w-[15px] h-[15px]"
                    alt=""
                  />
                  <h4 class="text-gray-500 text-xs font-semibold uppercase">
                    Total
                  </h4>
                </div>
                <p class="total-ques font-bold text-2xl"></p>
              </div>
              <div
                class="shadow-md border-s-4 border-solid border-blue-300 rounded-lg p-5"
              >
                <div class="flex items-center gap-1 mb-2">
                  <img
                    src="./assets/icons/icons8-correct-30.png"
                    class="w-[15px] h-[15px]"
                    alt=""
                  />
                  <h4 class="text-green-500 text-xs font-semibold uppercase">
                    correct
                  </h4>
                </div>
                <p class="total-correct-ques font-bold text-2xl"></p>
              </div>
              <div
                class="shadow-md border-s-4 border-solid border-blue-300 rounded-lg p-5"
              >
                <div class="flex items-center gap-1 mb-2">
                  <img
                    src="./assets/icons/icons8-x-48.png"
                    class="w-[15px] h-[15px]"
                    alt=""
                  />
                  <h4 class="text-red-500 text-xs font-semibold uppercase">
                    incorrect
                  </h4>
                </div>
                <p class="total-incorrect-ques font-bold text-2xl"></p>
              </div>
              <div
                class="shadow-md border-s-4 border-solid border-blue-300 rounded-lg p-5"
              >
                <div class="flex items-center gap-1 mb-2">
                  <img
                    src="./assets/icons/flag.png"
                    class="w-[15px] h-[15px]"
                    alt=""
                  />
                  <h4 class="text-yellow-500 text-xs font-semibold uppercase">
                    flagged
                  </h4>
                </div>
                <p class="total-flagged-ques font-bold text-2xl"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./js/result.js"></script>
  </body>
</html>
